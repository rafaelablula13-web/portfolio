<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio rafael</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container">
      <h1 id="meuNome"></h1>
      <p id="tituloProfissional"></p>
    </div>
  </header>

  <!-- SOBRE -->
  <section class="sobre container">
    <div class="card">
      <h2>👨‍💻 Sobre Mim</h2>
      <p id="minhaBio"></p>

      <div class="infos">
        <p id="curso"></p>
        <p id="anoIgresso"></p>
        <p id="anoFormatura"></p>
        <p id="tempoRestanteParaFormatura"></p>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="quiz container">
    <div class="card">
      <h2>🎯 Quiz Dev</h2>

      <div class="quiz-buttons">
        <button id="btn-visual">🎨 Gosto de Design</button>
        <button id="btn-logica">⚙️ Gosto de Lógica</button>
      </div>

      <div id="resultado-quiz"></div>
    </div>
  </section>

  <!-- PROJETOS -->
  <section class="container">
    <h2 class="titulo-secao">🚀 Projetos</h2>

    <div id="projetos" class="projetos-grid"></div>
  </section>

  <!-- INTERAÇÃO -->
  <section class="container">
    <div class="card">
      <h2>💬 Interação</h2>

      <div id="caixa">
        Esse texto será alterado
      </div>

      <button id="mudaTexto">Mudar Texto</button>

      <div class="input-area">
        <input type="text" id="nome" placeholder="Digite seu nome">
        <button id="enviar">Enviar</button>
      </div>
    </div>
  </section>

  <!-- API IBGE -->
  <section class="container">
    <div class="card">
      <h2>🌎 Localidades do Brasil</h2>

      <select id="select-estado">
        <option value="">Selecione um estado</option>
      </select>

      <select id="select-cidade" disabled>
        <option value="">Selecione um estado primeiro</option>
      </select>

      <p id="texto-regiao"></p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 - Rafael andrade batista</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
