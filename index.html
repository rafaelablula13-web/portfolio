<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Rafael Andrade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="perfil">
            <h1 id="meuNome"></h1>
            <h2 id="tituloProfissional"></h2>

            <p id="minhaBio"></p>

            <div class="info">
                <p id="anoFormatura"></p>
                <p id="diaFormatura"></p>
                <p id="tempoRestanteParaFormatura"></p>
            </div>
        </header>

        <section class="curso">
            <h2>🎓 Curso</h2>
            <div id="cursoInfo"></div>
        </section>

        <section class="quiz">
            <h2>🧠 Qual área combina com você?</h2>

            <div class="botoes">
                <button id="btn-visual">🎨 Gosto de Design</button>
                <button id="btn-logica">⚙️ Gosto de Lógica</button>
            </div>

            <div id="resultado-quiz"></div>
        </section>

        <section class="sobre">
            <h2>✨ Coisas sobre mim</h2>
            <div id="listaCoisas"></div>
        </section>

        <section class="projetos">
            <h2>🚀 Projetos</h2>
            <div id="containerProjetos"></div>
        </section>

    </div>
    <button id="mudaTexto">Clique aqui para mudar o texto.</button>
    
    <p class="paragrafo"> Parágrafo 1 </p>
    <p class="paragrafo"> Parágrafo 2 </p>
    <p class="paragrafo"> Parágrafo 3 </p>
    
    <div id="caixa"> Sou uma caixa </div>
    <input type="text" id="nome" name="usuario" placeholder="Digite seu nome aqui">
    <button id="enviar">Enviar</button>
    
    <ul>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ul>

    <script src="script.js"></script>
</body>

</html>
